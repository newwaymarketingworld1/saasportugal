<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:M;font-weight:400;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-400-normal.woff2)}
@font-face{font-family:M;font-weight:500;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-500-normal.woff2)}
@font-face{font-family:M;font-weight:600;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-600-normal.woff2)}
@font-face{font-family:M;font-weight:700;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-700-normal.woff2)}
@font-face{font-family:M;font-weight:800;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2)}
@font-face{font-family:M;font-weight:900;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-900-normal.woff2)}
:root{--k:#000;--w:#fff;--y:#FFC400;--g:#8C8C8C}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000;color:#fff;font-family:M,sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden;background:#000}
#cam{position:absolute;inset:0}
.scene{position:absolute;inset:0;visibility:hidden;overflow:hidden}
.bk{background:#000;color:#fff}.wh{background:#fff;color:#000}.ye{background:#FFC400;color:#000}
.drift{position:absolute;inset:0}
.c{position:absolute;left:0;right:0;text-align:center}
.lab{font-weight:600;font-size:24px;letter-spacing:.42em;text-transform:uppercase;color:var(--g)}
.y{color:var(--y)}
.chip{display:inline-flex;align-items:center;gap:14px;padding:16px 30px;border-radius:999px;font:700 26px M;letter-spacing:.08em;text-transform:uppercase}
/* ===== captions ===== */
.cap{position:absolute;left:60px;right:60px;text-align:center;font-weight:800;text-transform:uppercase;letter-spacing:-.012em;line-height:1.04}
.cap .ln{display:block;white-space:nowrap}
.cw{position:relative;display:inline-block;z-index:0}
.cw .bk2{position:absolute;left:0;top:0;color:#000;white-space:nowrap;clip-path:inset(0 100% 0 0)}
.cw .off{opacity:0}
.cw.yel{color:var(--y)}
.cw .hl{position:absolute;left:-.1em;right:-.1em;top:.06em;bottom:.0em;background:var(--y);z-index:-1;transform:scaleX(0);transform-origin:left}
.cw .sk{position:absolute;left:-.08em;right:-.08em;top:47%;height:.13em;background:var(--y);transform:scaleX(0);transform-origin:left}
.dark .cw .sk{background:#000}
.cw .crt{display:inline-block;width:0;height:.78em;vertical-align:-.04em;position:relative}
.cw .crt::after{content:'';position:absolute;left:.06em;top:0;width:.085em;height:100%;background:var(--y)}
.dark .cw .crt::after{background:#000}
.dark{color:#000}
.shd{text-shadow:0 6px 30px rgba(0,0,0,.7)}
/* ===== components ===== */
.sc{position:absolute;left:0;top:0;width:900px;border-radius:22px;overflow:hidden;background:#0d0d0d;box-shadow:0 0 0 1.5px rgba(255,255,255,.14),0 40px 90px rgba(0,0,0,.7)}
.sc .sb{height:44px;background:#161616;display:flex;align-items:center;gap:9px;padding:0 20px}
.sc .sb i{width:11px;height:11px;border-radius:50%;background:#3a3a3a}
.sc .sb b{margin-left:16px;font:600 17px M;color:#8a8a8a;letter-spacing:.03em}
.sc .si{position:relative;width:900px;height:437px;overflow:hidden}
.sc .si img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sc .dm{position:absolute;inset:0;background:#000;opacity:0}
.cf{position:absolute;left:50%;top:0;width:900px;margin-left:-450px}
.cf .sc{position:relative}
.cf .nm2{margin-top:24px;text-align:center;font:700 20px M;letter-spacing:.3em;color:#9a9a9a;text-transform:uppercase}
.lt{position:relative;flex:none;width:150px;height:150px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,.16)}
.lt img{position:absolute;left:4%;top:4%;width:92%;height:92%}
.lrow{position:absolute;left:0;height:150px;display:flex;gap:28px;padding-left:28px}
.bw{position:absolute;left:90px;width:900px;border-radius:26px;overflow:hidden;background:#111;box-shadow:0 0 0 2px #2a2a2a,0 40px 90px rgba(0,0,0,.6)}
.bw .bb{height:54px;background:#1a1a1a;display:flex;align-items:center;gap:11px;padding:0 22px}
.bw .bb i{width:13px;height:13px;border-radius:50%;background:#3a3a3a}
.bw .bb b{flex:1;height:28px;margin:0 60px;border-radius:14px;background:#262626;font:500 16px M;color:#777;display:flex;align-items:center;justify-content:center}
.vc{position:absolute;left:50px;width:980px;border-radius:26px;overflow:hidden;background:#000;box-shadow:0 0 0 2px #222,0 40px 90px rgba(0,0,0,.6)}
.vc .scr{position:relative;width:980px;height:553px}
.vc .scr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fd{position:absolute;top:0;width:540px;height:1920px;overflow:hidden}
.fd img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fd .sh{position:absolute;left:0;right:0;bottom:0;height:1100px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.94) 70%)}
.fd .nmt{position:absolute;top:250px;left:50px;font:800 26px M;letter-spacing:.3em;text-transform:uppercase}
.fd .nmt span{display:block;font:700 16px M;letter-spacing:.38em;color:var(--y);margin-top:10px}
.person{position:absolute;width:64px;height:76px}
.dotg i{position:absolute;width:12px;height:12px;border-radius:50%;background:#fff}
.toast{position:absolute;left:170px;right:170px;height:110px;border-radius:24px;background:#141414;color:#fff;display:flex;align-items:center;gap:22px;padding:0 26px;box-shadow:0 0 0 1.5px #2a2a2a,0 30px 60px rgba(0,0,0,.5)}
.toast .ic{width:62px;height:62px;border-radius:16px;background:#262626;display:flex;align-items:center;justify-content:center;flex:none}
.toast b{font:700 28px M}.toast span{display:block;font:500 20px M;color:#888;margin-top:4px}
.pill{flex:1;height:84px;border-radius:20px;background:#141414;box-shadow:0 0 0 1.5px #2a2a2a;display:flex;align-items:center;justify-content:center;gap:14px;font:800 26px M;letter-spacing:.1em;color:#777}
.pill em{font-style:normal;font-weight:700;font-size:20px;opacity:.7}
.bub{position:absolute;padding:16px 24px;border-radius:20px 20px 20px 4px;background:#fff;color:#000;font:700 24px M;box-shadow:0 20px 40px rgba(0,0,0,.4);white-space:nowrap}
.mo{height:84px;border-radius:18px;background:#141414;box-shadow:0 0 0 1.5px #2a2a2a;display:flex;align-items:center;justify-content:center;font:800 26px M;letter-spacing:.1em;color:#bbb;position:relative}
.mo .st{position:absolute;left:14px;right:14px;top:50%;height:6px;margin-top:-3px;background:var(--y);transform:scaleX(0);transform-origin:left}
.btn{display:inline-flex;align-items:center;gap:24px;padding:42px 66px;border-radius:999px;background:var(--y);color:#000;font:800 44px M;letter-spacing:.02em;text-transform:uppercase}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
#wipe{position:absolute;inset:0;pointer-events:none}
#wipe i{position:absolute;top:-5%;bottom:-5%;width:26%;transform:translateY(-110%)}
#slices{position:absolute;inset:0;pointer-events:none}
#slices i{position:absolute;left:0;width:100%;height:16.7%;background:#000}
#nmask{position:absolute;inset:0;pointer-events:none;visibility:hidden}
#nmask .nfill{position:absolute;inset:0;background:#FFC400;opacity:0}
#vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 62% at 50% 45%,rgba(0,0,0,0) 60%,rgba(0,0,0,.42))}
#grain{position:absolute;inset:0;width:1080px;height:1920px;opacity:.06;mix-blend-mode:overlay;pointer-events:none}

.inv .cw .hl{background:#000}
.inv .cw .bk2{color:#FFC400}
#dip{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.sbar{position:absolute;left:80px;right:80px;height:124px;border-radius:999px;background:#fff;color:#111;display:flex;align-items:center;gap:26px;padding:0 44px;box-shadow:0 30px 80px rgba(255,196,0,.18),0 0 0 1px rgba(255,255,255,.4)}
.sbar .q{font:600 40px M;letter-spacing:-.01em;white-space:nowrap}
.sbar .q i{display:inline-block;width:3px;height:40px;background:#111;vertical-align:-6px;margin-left:3px}
.res{position:absolute;left:80px;right:80px;height:132px;border-radius:24px;background:#121212;box-shadow:0 0 0 1.5px #262626;display:flex;align-items:center;gap:26px;padding:0 30px}
.res .fv{width:72px;height:72px;border-radius:18px;background:#262626;flex:none;display:flex;align-items:center;justify-content:center;font:800 30px M;color:#777}
.res b{display:block;font:700 32px M;color:#fff}.res span{display:block;font:500 22px M;color:#7a7a7a;margin-top:6px}
.res .st5{margin-left:auto;font:700 24px M;color:#FFC400;white-space:nowrap}
.lbl{position:absolute;display:inline-flex;align-items:center;gap:10px;padding:10px 20px;border-radius:999px;font:800 20px M;letter-spacing:.14em;text-transform:uppercase}
.shine{position:absolute;inset:0;background:linear-gradient(105deg,rgba(255,255,255,0) 35%,rgba(255,255,255,.35) 50%,rgba(255,255,255,0) 65%);transform:translateX(-120%)}
.ring{position:absolute;left:50%;top:50%;border-radius:50%;border:3px solid rgba(255,196,0,.6)}
.sel{position:absolute;border:3px dashed #FFC400;border-radius:10px}
.sel i{position:absolute;width:16px;height:16px;background:#FFC400;border-radius:3px}
.tt{position:absolute;width:440px;height:214px;border-radius:16px;overflow:hidden;box-shadow:0 0 0 1.5px rgba(255,255,255,.14),0 24px 50px rgba(0,0,0,.6)}
.tt img{width:100%;height:100%;display:block}
.stp{position:absolute;left:90px;right:90px;height:200px;border-radius:30px;background:#111;box-shadow:0 0 0 1.5px #262626}
.stp .n{position:absolute;left:34px;top:-22px;padding:8px 18px;border-radius:999px;background:#FFC400;color:#000;font:900 24px M;letter-spacing:.08em}
</style></head>
<body>
<div id="stage"><div id="cam">

<!-- S1 INTRO: the N drawn as one continuous line -->

 <div id="g1" style="position:absolute;left:-200px;right:-200px;top:500px;height:900px;background:radial-gradient(ellipse 45% 45% at 50% 50%,rgba(255,196,0,.18),rgba(255,196,0,0) 70%);opacity:0"></div>
 <svg id="nline" viewBox="392 370 290 138" style="position:absolute;left:190px;top:790px;width:700px;overflow:visible"></svg>

 </div>

<section class="scene bk" id="s6"><div class="drift">

 <div id="rowA" class="lrow" style="top:590px"></div>
 <div id="rowB" class="lrow" style="top:770px"></div>
 <div class="caps"></div>
</div></section>

<!-- S7 100+ WEBSITES ACROSS THE U.S. -->
<section class="scene bk" id="s7"><div class="drift">

 <div id="tg" style="position:absolute;left:66px;top:600px;width:948px;height:330px"></div>

</div></section>

<!-- S8 REAL PEOPLE -->
<section class="scene bk" id="s8">
 <div class="fd" id="fp" style="left:0"><img src="pedro.jpg" style="object-position:47% 38%"><div class="sh"></div><div class="nmt">Pedro<span>CO-FOUNDER</span></div></div>
 <div class="fd" id="fg" style="left:540px"><img src="gustavo.jpg" style="object-position:44% 38%"><div class="sh"></div><div class="nmt">Gustavo<span>CO-FOUNDER</span></div></div>
 <div id="fdiv" style="position:absolute;left:538px;top:0;width:4px;height:1920px;background:var(--y);transform:scaleY(0);transform-origin:top"></div>

<!-- S9 HOW IT WORKS -->
<section class="scene bk" id="s9"><div class="drift">

 </div>

<!-- S11 OUTRO (yellow) -->
<section class="scene ye" id="s11"><div class="drift">
 <div id="logo11" style="position:absolute;left:150px;width:780px;top:560px">
  <div id="symw11" style="width:300px;margin:0 auto 36px"><svg id="sym11" viewBox="392 370 290 138" style="display:block;width:300px;overflow:visible"></svg></div>
  <svg id="wm11" viewBox="196 544 688 110" style="display:block;width:780px;overflow:visible"></svg>

</div>
<div id="dip"></div>
<div id="vign"></div>
